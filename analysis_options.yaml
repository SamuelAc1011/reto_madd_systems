include:
  - package:very_good_analysis/analysis_options.yaml
  - package:bloc_lint/recommended.yaml
analyzer:
  exclude:
    - lib/l10n/gen/*
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
linter:
  rules:
    public_member_api_docs: false
    unnecessary_type_name_in_constructor: false
